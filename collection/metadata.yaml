description: >
  Eight stories spanning seven hundred years, from a medieval Zen monastery
  to a teenage girl visiting her catatonic mother. Each explores a different
  facet of the same horror: what happens when human minds encounter patterns
  too large to hold.
  \n\n
  A 14th-century monk achieves recursive self-perception through decades of
  zazen. Leibniz convenes a secret meeting to preserve two ways of knowing.
  A physicist builds instruments she doesn't understand. Thirty-seven
  volunteers test unfiltered AI models and twelve of them die. Diplomats
  negotiate protocols for a threat they can't perceive. A woman walks away
  from the institution that killed her brother. A man's love for his wife
  persists as his cognition fragments. A daughter brings a butterfly
  drawing to a mother who can't see it.
  \n\n
  Companion to the novel Echoes of the Sublime. These stories can be read
  independently.
